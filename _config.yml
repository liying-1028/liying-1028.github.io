# Basic Site Settings
locale                   : "en-US"
site_theme               : "default"
title                    : "Li Ying | Shenzhen University"
title_separator          : "-"
name                     : &name "Li Ying"
description              : &description "Ph.D. student in Electronic and Information Engineering at Shenzhen University, focusing on spatial multi-omics data integration and cancer biology."
url                      : "https://liying-1028.github.io"
baseurl                  : ""
repository               : "liying-1028/liying-1028.github.io"

# Site Author
author:
  avatar           : "profile.png"
  name             : "Li Ying"
  pronouns         : "she/her"
  bio              : "Ph.D. student in Electronic and Information Engineering at Shenzhen University, focusing on spatial multi-omics data integration and cancer biology."
  location         : "Shenzhen, China"
  employer         : "Shenzhen University"
  email            : "liying.2023@email.szu.edu.cn"

  # Academic profiles
  googlescholar    : "https://scholar.google.com/citations?user=0LzPDukAAAAJ&hl=en"
  orcid            : "https://orcid.org/"
  researchgate     : 
  github           : "liying-1028"
  linkedin         : 
  zhihu            : 

# Publication categories
publication_category:
  books:
    title: 'Books'
  manuscripts:
    title: 'Journal Articles'
  conferences:
    title: 'Conference Papers'

# Site Settings
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false

# Comments (disabled)
comments:
  provider: false

# Atom/RSS feed
atom_feed:
  hide: false
  path:

# SEO
google_site_verification :
bing_site_verification   :

# Social Sharing
twitter:
  username: 
facebook:
  username: 

# Analytics
analytics:
  provider: "false"

# Reading and Output
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Output and Timezone
permalink: /:categories/:title/
timezone: Asia/Singapore

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development
